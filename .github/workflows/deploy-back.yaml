name: Deploy to Amazon

on:
  repository_dispatch:
    types: [worker-image-updated, core-image-updated]

jobs:
  deploy:
    name: Deploy on private EC2
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend
      cancel-in-progress: true
    steps:
      - name: Setup SSH keys
        env:
          # Alterado para BUNDLE_PUBLIC_BASTION para bater exatamente com o seu print
          SECRET_BASTION_KEY: ${{ secrets.SSH_KEY_PUBLIC_BASTION }}
          SECRET_TARGET_KEY: ${{ secrets.SSH_KEY_PRIVATE_TARGET }}
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # As aspas duplas mantêm as quebras de linha originais do segredo
          echo "$SECRET_BASTION_KEY" > ~/.ssh/bastion.pem
          echo "$SECRET_TARGET_KEY" > ~/.ssh/target.pem

          # Ajusta as permissões exigidas pelo SSH
          chmod 600 ~/.ssh/bastion.pem ~/.ssh/target.pem

          # Escaneia o Bastion para evitar o aviso de "Host desconhecido"
          ssh-keyscan -H "$BASTION_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via bastion
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          BASTION_USER: ${{ secrets.BASTION_USER }}
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          TARGET_USER: ${{ secrets.TARGET_USER }}
          REPO_DIR: ${{ secrets.REPO_DIR }}
          REPO_BRANCH: ${{ secrets.REPO_BRANCH }}
        run: |
          set -euo pipefail
          
          # Inicializa o agente SSH e adiciona as duas chaves salvas na memória
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/bastion.pem
          ssh-add ~/.ssh/target.pem
          
          # Executa o SSH usando 'docker compose' (sem o hífen e sem a flag -f)
          ssh -v -o StrictHostKeyChecking=no \
                 -o PubkeyAcceptedKeyTypes=+ssh-rsa \
                 -J "$BASTION_USER@$BASTION_HOST" \
                 "$TARGET_USER@$TARGET_HOST" \
                 "cd $REPO_DIR && git fetch --all && git checkout $REPO_BRANCH && git pull && docker compose pull && docker compose up -d --remove-orphans"